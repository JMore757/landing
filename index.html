<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My landing page</title>
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <!-- We need this line below for responsiveness! -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="banner">
  <div class="container">
    <h1>Your product</h1>
    <p>Something awesome that solves a problem.</p>
    <a href="#" class="btn-medium">Start now</a>
  </div>
</div>

<div class="how-it-works">
  <div class="container">
    <h2>How it works</h2>

    <div class="cards">
      <div class="card">
          <img src="images/apply.svg" alt="simple animated photo of a web page and a map">
        <h3>Choose</h3>
        <p>Choose the product or service you need.</p>
      </div>

      <div class="card">
          <img src="images/learn.svg" alt="simple animated photo of 2 people sitting in front of a computer">
        <h3>Use</h3>
        <p>Use it easily and enjoy the experience.</p>
      </div>

      <div class="card">
          <img src="images/product.svg" alt="simple animated photo of a phone made out of puzzle pieces">
        <h3>Enjoy</h3>
        <p>Get the result you're looking for.</p>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="container">
    <p>Made with ❤️</p>
    <a href="https://www.instagram.com/?hl=en"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://github.com/"><i class="fa-brands fa-github"></i></a>
  </div>
</div>
</body>
</html>
